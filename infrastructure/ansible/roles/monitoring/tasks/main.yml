---
- name: Install node_exporter for Prometheus scraping
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: yes

- name: Enable + start node_exporter
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    enabled: yes
    state: started

- name: Allow node_exporter only from monitoring CIDR
  community.general.ufw:
    rule: allow
    port: "9100"
    proto: tcp
    src: "{{ monitoring_cidr | default('10.0.0.0/8') }}"
