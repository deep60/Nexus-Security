---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
      - ufw
      - fail2ban
      - unattended-upgrades
      - htop
      - jq
    state: present
    update_cache: yes

- name: Create verdyx user
  ansible.builtin.user:
    name: "{{ verdyx_user }}"
    shell: /bin/bash
    groups: docker
    append: yes
    create_home: yes

- name: Configure UFW (allow ssh, http, https only)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ['22', '80', '443']

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: '0644'
