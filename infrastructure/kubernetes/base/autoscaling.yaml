# HorizontalPodAutoscaler for every backend microservice.
# Targets average CPU 70% and memory 80% utilization. Tune per service later
# based on observed traffic patterns. The api-gateway already has its own HPA
# in api-gateway/deployment.yaml — keep this file for the other 9 services.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-service-hpa
  namespace: verdyx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - { type: Resource, resource: { name: cpu,    target: { type: Utilization, averageUtilization: 70 } } }
  - { type: Resource, resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } } }
---
