apiVersion: v1
kind: Service
metadata:
  name: nexus-admin-service
  namespace: nexus-security
  labels:
    app: nexus-admin
    component: admin
    service: admin
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8888
    targetPort: http
    protocol: TCP
  selector:
    app: nexus-admin
  sessionAffinity: None

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-admin-sa
  namespace: nexus-security
  labels:
    app: nexus-admin
    component: admin

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nexus-admin-role
  namespace: nexus-security
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nexus-admin-rolebinding
  namespace: nexus-security
subjects:
- kind: ServiceAccount
  name: nexus-admin-sa
  namespace: nexus-security
roleRef:
  kind: Role
  name: nexus-admin-role
  apiGroup: rbac.authorization.k8s.io
