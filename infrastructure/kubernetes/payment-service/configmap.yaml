apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: verdyx
  labels:
    app: payment-service
    component: backend
    service: payment
data:
  # Chain id is a non-secret config; the RPC URL and treasury private key
  # are injected from verdyx-blockchain-secret in deployment.yaml.
  BLOCKCHAIN_CHAIN_ID: "1"
  GAS_LIMIT: "500000"
  GAS_PRICE_GWEI: "20"
  GAS_PRICE_MULTIPLIER: "1.2"
  CONFIRMATION_BLOCKS: "3"
  TRANSACTION_TIMEOUT_SECONDS: "300"
  RETRY_ATTEMPTS: "5"
  PLATFORM_FEE_PERCENT: "5"
  MIN_PAYOUT_AMOUNT: "1"
  PAYMENT_RETRY_INTERVAL_SECONDS: "60"
  RUST_LOG: "info,payment_service=debug"
  ENVIRONMENT: "production"
