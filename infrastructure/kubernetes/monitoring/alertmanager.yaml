apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: verdyx
  labels:
    app: alertmanager
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'app']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'slack-default'
      routes:
      - matchers: [severity="critical"]
        receiver: 'slack-critical'
        continue: true
    receivers:
    - name: 'slack-default'
      slack_configs:
      - api_url_file: /etc/alertmanager/secret/slack_webhook_url
        channel: '#verdyx-alerts'
        send_resolved: true
        title: '{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}'
    - name: 'slack-critical'
      slack_configs:
      - api_url_file: /etc/alertmanager/secret/slack_webhook_url
        channel: '#verdyx-alerts-critical'
        send_resolved: true
        title: '🚨 {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}'
---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-slack
  namespace: verdyx
type: Opaque
stringData:
  # Replace with a real incoming-webhook URL.
  slack_webhook_url: "https://hooks.slack.com/services/CHANGE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: verdyx
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels: { app: alertmanager }
  template:
    metadata:
      labels: { app: alertmanager }
    spec:
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.27.0
        args:
        - --config.file=/etc/alertmanager/alertmanager.yml
        - --storage.path=/alertmanager
        ports:
        - containerPort: 9093
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager
        - name: secret
          mountPath: /etc/alertmanager/secret
          readOnly: true
        - name: data
          mountPath: /alertmanager
        resources:
          requests: { memory: "128Mi", cpu: "50m" }
          limits:   { memory: "256Mi", cpu: "200m" }
      volumes:
      - name: config
        configMap: { name: alertmanager-config }
      - name: secret
        secret: { secretName: alertmanager-slack }
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: verdyx
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 9093
    targetPort: 9093
  selector: { app: alertmanager }
