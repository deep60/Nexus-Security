apiVersion: v1
kind: Service
metadata:
  name: nexus-frontend-service
  namespace: nexus-security
  labels:
    app: nexus-frontend
    component: frontend
    service: web
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3000
    targetPort: http
    protocol: TCP
  selector:
    app: nexus-frontend
  sessionAffinity: None

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-frontend-sa
  namespace: nexus-security
  labels:
    app: nexus-frontend
    component: frontend
