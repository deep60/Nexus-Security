apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: verdyx-ingress
  namespace: verdyx
  labels:
    app.kubernetes.io/name: verdyx
    app.kubernetes.io/component: ingress
  annotations:
    # NGINX Ingress Controller annotations
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss: https:; font-src 'self' https://fonts.gstatic.com;" always;
    
    # Rate limiting for API protection
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    
    # Large file upload support for malware samples
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/client-max-body-size: "100m"
    
    # Timeouts for long-running analysis
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    
    # CORS for web3 integration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://verdyx.com, https://app.verdyx.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-API-Key"
    
    # Load balancing
    nginx.ingress.kubernetes.io/load-balance: "ewma"
    
    # WebSocket support for real-time updates
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/websocket-services: "verdyx-api-gateway-service"

spec:
  tls:
  - hosts:
    - verdyx.com
    - api.verdyx.com
    - app.verdyx.com
    secretName: verdyx-tls
  
  rules:
  # Main web application
  - host: verdyx.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: verdyx-frontend-service
            port:
              number: 3000
  
  # Web application (app subdomain)
  - host: app.verdyx.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: verdyx-frontend-service
            port:
              number: 3000
  
  # API endpoints — all routed through the api-gateway
  # The gateway handles internal routing to microservices,
  # auth middleware, rate limiting, and logging.
  - host: api.verdyx.com
    http:
      paths:
      # WebSocket upgrade — must be before the catch-all
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: verdyx-api-gateway-service
            port:
              number: 8080
      
      # All API routes through the gateway
      - path: /
        pathType: Prefix
        backend:
          service:
            name: verdyx-api-gateway-service
            port:
              number: 8080

---
# Additional ingress for internal admin interface (with basic auth)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: verdyx-admin-ingress
  namespace: verdyx
  labels:
    app.kubernetes.io/name: verdyx
    app.kubernetes.io/component: admin-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: verdyx-admin-auth
    nginx.ingress.kubernetes.io/auth-realm: "Verdyx Admin Area"
    nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.0.0/8,192.168.0.0/16,172.16.0.0/12"
spec:
  tls:
  - hosts:
    - admin.verdyx.com
    secretName: verdyx-admin-tls
  
  rules:
  - host: admin.verdyx.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: verdyx-admin-service
            port:
              number: 8888