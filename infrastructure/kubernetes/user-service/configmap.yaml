apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: verdyx
  labels:
    app: user-service
    component: backend
    service: user
data:
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  RUST_LOG: "info,user_service=debug"
  ENVIRONMENT: "production"
  JWT_EXPIRY_HOURS: "12"
  BCRYPT_SALT_ROUNDS: "12"
  PASSWORD_MIN_LENGTH: "12"
  MAX_LOGIN_ATTEMPTS: "5"
  LOCKOUT_DURATION_MINUTES: "15"
  AVATAR_MAX_SIZE_BYTES: "5242880"   # 5 MB
  ENABLE_2FA: "true"
  ENABLE_KYC: "false"
