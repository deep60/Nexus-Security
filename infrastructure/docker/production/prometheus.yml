global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'verdyx'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Backend microservices ────────────────────────────────────────────────
  # Every backend service listens on internal port 8080 inside the compose
  # network and exposes Prometheus text metrics at /metrics. (Host port
  # mappings differ, but Prometheus scrapes by container name + internal port.)
  - job_name: 'api-gateway'
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['api-gateway:8080']
        labels: { service: 'api-gateway' }

  - job_name: 'user-service'
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['user-service:8080']
        labels: { service: 'user-service' }

  - job_name: 'analysis-engine'
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['analysis-engine:8080']
        labels: { service: 'analysis-engine' }

  - job_name: 'bounty-manager'
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['bounty-manager:8080']
        labels: { service: 'bounty-manager' }

  - job_name: 'submission-service'
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['submission-service:8080']
        labels: { service: 'submission-service' }

  - job_name: 'consensus-service'
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['consensus-service:8080']
        labels: { service: 'consensus-service' }

  - job_name: 'payment-service'
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['payment-service:8080']
        labels: { service: 'payment-service' }

  - job_name: 'reputation-service'
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['reputation-service:8080']
        labels: { service: 'reputation-service' }

  - job_name: 'notification-service'
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['notification-service:8080']
        labels: { service: 'notification-service' }

  # ── Infra exporters (optional; enable the exporters in compose to use) ────
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s
