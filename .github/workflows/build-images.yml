name: Build images (multi-arch)

# Manually-triggered build of all service images for BOTH linux/amd64 and
# linux/arm64, pushed to GHCR as multi-arch manifests. arm64 is required to run
# on Oracle Cloud "Always Free" Ampere (ARM) VMs; amd64 keeps x86 hosts and the
# CI smoke test working. `docker compose pull` on the VM then gets the right
# architecture automatically.
#
# NOTE: arm64 layers are built under QEMU emulation, so the Rust compile is slow
# (tens of minutes). That is fine for an occasional manual seed build. If it ever
# gets too slow, split the build across native runners: build amd64 on
# `ubuntu-latest` and arm64 on `ubuntu-24.04-arm` (free for public repos), push
# by digest, then merge the manifest with `docker buildx imagetools create`.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms"
        default: linux/amd64,linux/arm64
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: frontend,             context: ./frontend, dockerfile: ./frontend/Dockerfile }
          - { service: api-gateway,          context: ./backend,  dockerfile: ./backend/api-gateway/Dockerfile }
          - { service: analysis-engine,      context: ./backend,  dockerfile: ./backend/analysis-engine/Dockerfile }
          - { service: bounty-manager,       context: ./backend,  dockerfile: ./backend/bounty-manager/Dockerfile }
          - { service: consensus-service,    context: ./backend,  dockerfile: ./backend/consensus-service/Dockerfile }
          - { service: notification-service, context: ./backend,  dockerfile: ./backend/notification-service/Dockerfile }
          - { service: payment-service,      context: ./backend,  dockerfile: ./backend/payment-service/Dockerfile }
          - { service: reputation-service,   context: ./backend,  dockerfile: ./backend/reputation-service/Dockerfile }
          - { service: submission-service,   context: ./backend,  dockerfile: ./backend/submission-service/Dockerfile }
          - { service: user-service,         context: ./backend,  dockerfile: ./backend/user-service/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      # QEMU lets this amd64 runner emulate arm64 for the cross-build.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ghcr.io/deep60/verdyx-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
