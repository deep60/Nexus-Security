name: Deploy to Staging

# Staging deploy: triggered on develop branch, full build/deploy of every service
# without path-based change detection. Used as a release candidate gate before
# promoting to main/production.

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
        env:
          NODE_ENV: test

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: verdyx_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - working-directory: ./backend
        run: cargo test --workspace
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/verdyx_test
          REDIS_URL: redis://localhost:6379

  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: frontend,             context: ./frontend, dockerfile: ./frontend/Dockerfile }
          - { service: api-gateway,          context: ./backend,  dockerfile: ./backend/api-gateway/Dockerfile }
          - { service: analysis-engine,      context: ./backend,  dockerfile: ./backend/analysis-engine/Dockerfile }
          - { service: bounty-manager,       context: ./backend,  dockerfile: ./backend/bounty-manager/Dockerfile }
          - { service: consensus-service,    context: ./backend,  dockerfile: ./backend/consensus-service/Dockerfile }
          - { service: notification-service, context: ./backend,  dockerfile: ./backend/notification-service/Dockerfile }
          - { service: payment-service,      context: ./backend,  dockerfile: ./backend/payment-service/Dockerfile }
          - { service: reputation-service,   context: ./backend,  dockerfile: ./backend/reputation-service/Dockerfile }
          - { service: submission-service,   context: ./backend,  dockerfile: ./backend/submission-service/Dockerfile }
          - { service: user-service,         context: ./backend,  dockerfile: ./backend/user-service/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/verdyx-${{ matrix.service }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=staging-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=staging-${{ matrix.service }}

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: https://staging.verdyx.io
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      - name: Deploy
        run: |
          # Same on-VM entrypoint as production (ensures RDS databases, pulls,
          # restarts with startup migrations, health-checks). See
          # infrastructure/DEPLOYMENT.md.
          ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }} \
            "cd /opt/verdyx && git fetch origin develop && git checkout origin/develop -- scripts/deployment/remote-deploy.sh scripts/deployment/ensure-databases.sh && BRANCH=develop bash scripts/deployment/remote-deploy.sh"
      - name: External smoke test
        run: |
          sleep 10
          curl --fail --retry 5 --retry-delay 10 https://staging.verdyx.io/api/v1/health
