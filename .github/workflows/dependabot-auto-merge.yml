name: Dependabot auto-merge

# Auto-merge Dependabot *patch* updates once CI is green; leave minor AND major
# for manual review. Minors are NOT auto-merged because Cargo uses 0.x semver:
# for a 0.x crate, a breaking `0.7 -> 0.8` (axum) or `0.10 -> 0.11` (sha2) bump
# is classified by Dependabot as `semver-minor`, and such bumps have shipped
# code that no longer compiles. "Green" is only as strong as the repo's REQUIRED
# status checks — ensure `test-backend` / `test-frontend` are required in branch
# protection, not just CodeQL (a SAST scan that does not gate the Rust build).
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (patch only)
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag minor/major for manual review
        if: contains(fromJSON('["version-update:semver-minor", "version-update:semver-major"]'), steps.meta.outputs.update-type)
        run: |
          gh pr comment "$PR_URL" --body "🔒 **${TYPE#version-update:semver-} update** — \`${DEP}\` \`${PREV}\` → \`${NEW}\`. Not auto-merged: under Cargo's 0.x semver a 'minor' bump can be breaking (e.g. axum 0.7→0.8, sha2 0.10→0.11 shipped non-compiling code; jsonwebtoken 9→10 broke the JWT tests). Please review and merge manually."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TYPE: ${{ steps.meta.outputs.update-type }}
          DEP: ${{ steps.meta.outputs.dependency-names }}
          PREV: ${{ steps.meta.outputs.previous-version }}
          NEW: ${{ steps.meta.outputs.new-version }}
