name: Dependabot auto-merge

# Auto-merge Dependabot patch/minor updates once CI is green; leave majors for
# manual review. "Green" is enforced by GitHub's auto-merge, which waits for the
# repo's required status checks (CodeQL) before merging. The post-merge pipeline
# (deploy.yml) + build-gated deploy are the backstop: a bad bump that slips
# through fails CI on main and never produces a deployable image.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (patch/minor)
        if: contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.meta.outputs.update-type)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag majors for manual review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "🔒 **Major update** — \`${DEP}\` \`${PREV}\` → \`${NEW}\`. Not auto-merged: major bumps can be breaking (e.g. the jsonwebtoken 9→10 regression that broke the JWT tests). Please review and merge manually."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEP: ${{ steps.meta.outputs.dependency-names }}
          PREV: ${{ steps.meta.outputs.previous-version }}
          NEW: ${{ steps.meta.outputs.new-version }}
