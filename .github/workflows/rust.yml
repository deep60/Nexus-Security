name: Rust CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: verdyx_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: backend

    - name: Build
      run: cargo build --workspace --verbose

    - name: Install sqlx-cli
      uses: taiki-e/install-action@v2
      with:
        tool: sqlx-cli

    - name: Set up test databases (create + run migrations)
      # Creates one database per service and applies that service's migrations,
      # so a broken/missing schema fails CI here instead of only at runtime.
      # Exposes the per-service DATABASE_URLs to later steps via $GITHUB_ENV.
      working-directory: ${{ github.workspace }}
      env:
        PGHOST: localhost
        PGPORT: 5432
        PGUSER: test_user
        PGPASSWORD: test_password
      run: |
        ./scripts/ci/setup-test-databases.sh
        cat "${{ github.workspace }}/.ci-test-db-env" >> "$GITHUB_ENV"

    - name: Run tests
      run: cargo test --workspace --verbose
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/verdyx_test
        REDIS_URL: redis://localhost:6379

    - name: Clippy
      run: cargo clippy --workspace -- -D warnings

    - name: Format check
      run: cargo fmt --all -- --check
