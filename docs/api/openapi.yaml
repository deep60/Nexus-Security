openapi: 3.0.3
info:
  title: Nexus Security API
  version: 1.0.0
  description: |
    Core API gateway routes for Nexus Security.
servers:
  - url: http://localhost:8080/api/v1
    description: Local
  - url: https://api-staging.nexus-security.com/api/v1
    description: Staging
  - url: https://api.nexus-security.com/api/v1
    description: Production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
    CreateBountyRequest:
      type: object
      required: [title, description, reward_amount, expires_at]
      properties:
        title:
          type: string
        description:
          type: string
        reward_amount:
          type: number
        expires_at:
          type: string
          format: date-time

paths:
  /health:
    get:
      summary: Service health
      responses:
        '200':
          description: Healthy

  /health/ready:
    get:
      summary: Readiness check
      responses:
        '200':
          description: Ready

  /health/live:
    get:
      summary: Liveness check
      responses:
        '200':
          description: Live

  /auth/login:
    post:
      summary: Login and get JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Invalid credentials

  /auth/register:
    post:
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                username:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: User created
        '400':
          description: Validation failed

  /bounties:
    get:
      summary: List bounties
      responses:
        '200':
          description: Bounty list
    post:
      summary: Create a bounty
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBountyRequest'
      responses:
        '201':
          description: Bounty created
        '401':
          description: Unauthorized

  /bounties/{bounty_id}:
    get:
      summary: Get bounty by id
      parameters:
        - in: path
          name: bounty_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bounty details
        '404':
          description: Not found

  /analysis:
    get:
      summary: List analyses
      responses:
        '200':
          description: Analysis list

  /analysis/submit:
    post:
      summary: Submit analysis
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bounty_id:
                  type: string
                verdict:
                  type: string
                confidence:
                  type: number
                report:
                  type: string
      responses:
        '200':
          description: Analysis submitted
        '401':
          description: Unauthorized

  /users/me:
    get:
      summary: Current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
        '401':
          description: Unauthorized
