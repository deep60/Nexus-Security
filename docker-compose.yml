services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: verdyx-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verdyx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-verdyx}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - verdyx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdyx_user -d verdyx"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: verdyx-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    env_file:
      - .env
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - verdyx-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway Service
  api-gateway:
    build:
      context: ./backend
      dockerfile: ./api-gateway/Dockerfile
    container_name: verdyx-api-gateway
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://${POSTGRES_USER:-verdyx_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-verdyx}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - JWT_SECRET=${JWT_SECRET}
      # Blockchain Configuration
      - BLOCKCHAIN_RPC_URL=${BLOCKCHAIN_RPC_URL}
      - THREAT_TOKEN_ADDRESS=${THREAT_TOKEN_ADDRESS}
      - REPUTATION_SYSTEM_ADDRESS=${REPUTATION_SYSTEM_ADDRESS}
      - BOUNTY_MANAGER_ADDRESS=${BOUNTY_MANAGER_ADDRESS}
      - CHAIN_ID=${CHAIN_ID:-31337}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped

  # User Service
  user-service:
    build:
      context: ./backend
      dockerfile: ./user-service/Dockerfile
    container_name: verdyx-user-service
    env_file:
      - .env
    ports:
      - "8081:8080"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://${POSTGRES_USER:-verdyx_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-verdyx}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - JWT_SECRET=${JWT_SECRET}
      # Blockchain Configuration
      - BLOCKCHAIN_RPC_URL=${BLOCKCHAIN_RPC_URL}
      - THREAT_TOKEN_ADDRESS=${THREAT_TOKEN_ADDRESS}
      - REPUTATION_SYSTEM_ADDRESS=${REPUTATION_SYSTEM_ADDRESS}
      - BOUNTY_MANAGER_ADDRESS=${BOUNTY_MANAGER_ADDRESS}
      - CHAIN_ID=${CHAIN_ID:-31337}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MinIO (S3-compatible object storage)
  minio:
    image: minio/minio:latest
    container_name: verdyx-minio
    command: server /data --console-address ":9001"
    env_file:
      - .env
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-verdyx_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - verdyx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ClamAV Antivirus Scanner
  clamav:
    image: clamav/clamav-debian:latest
    container_name: verdyx-clamav
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - verdyx-network
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    restart: unless-stopped

  # Analysis Engine Service
  analysis-engine:
    build:
      context: ./backend
      dockerfile: ./analysis-engine/Dockerfile
    container_name: verdyx-analysis-engine
    env_file:
      - .env
    ports:
      - "8082:8080"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://${POSTGRES_USER:-verdyx_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-verdyx}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      # S3/MinIO Configuration for file storage
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_BUCKET=verdyx-submissions
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-verdyx_admin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      # YARA rules configuration
      - YARA_RULES_PATH=/app/rules
      # ClamAV configuration
      - CLAMAV_HOST=clamav:3310
      - ENABLE_CLAMAV=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped

  # Bounty Manager Service
  bounty-manager:
    build:
      context: ./backend
      dockerfile: ./bounty-manager/Dockerfile
    container_name: verdyx-bounty-manager
    env_file:
      - .env
    ports:
      - "8083:8080"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://${POSTGRES_USER:-verdyx_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-verdyx}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      # Blockchain Configuration
      - BLOCKCHAIN_RPC_URL=${BLOCKCHAIN_RPC_URL}
      - THREAT_TOKEN_ADDRESS=${THREAT_TOKEN_ADDRESS}
      - REPUTATION_SYSTEM_ADDRESS=${REPUTATION_SYSTEM_ADDRESS}
      - BOUNTY_MANAGER_ADDRESS=${BOUNTY_MANAGER_ADDRESS}
      - CHAIN_ID=${CHAIN_ID:-31337}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Submission Service
  submission-service:
    build:
      context: ./backend
      dockerfile: ./submission-service/Dockerfile
    container_name: verdyx-submission-service
    env_file:
      - .env
    ports:
      - "8084:8080"
    environment:
      - RUST_LOG=info
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SUBMISSION_SERVICE_PORT=8080
      # Database and Redis Configuration
      - DATABASE_URL=postgresql://${POSTGRES_USER:-verdyx_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-verdyx}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      # S3/MinIO Configuration
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_BUCKET=verdyx-submissions
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-verdyx_admin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped

  # Consensus Service
  consensus-service:
    build:
      context: ./backend
      dockerfile: ./consensus-service/Dockerfile
    container_name: verdyx-consensus-service
    env_file:
      - .env
    ports:
      - "8085:8080"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://${POSTGRES_USER:-verdyx_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-verdyx}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      # Consensus algorithm configuration
      - CONSENSUS_THRESHOLD=0.7
      - MIN_SUBMISSIONS_REQUIRED=3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped

  # Payment Service
  payment-service:
    build:
      context: ./backend
      dockerfile: ./payment-service/Dockerfile
    container_name: verdyx-payment-service
    env_file:
      - .env
    ports:
      - "8086:8080"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://${POSTGRES_USER:-verdyx_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-verdyx}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      # Blockchain Configuration
      - BLOCKCHAIN_RPC_URL=${BLOCKCHAIN_RPC_URL}
      - BLOCKCHAIN_CHAIN_ID=${CHAIN_ID:-31337}
      - TREASURY_ADDRESS=${TREASURY_ADDRESS}
      - TREASURY_PRIVATE_KEY=${TREASURY_PRIVATE_KEY}
      - TOKEN_CONTRACT_ADDRESS=${THREAT_TOKEN_ADDRESS}
      - PAYMENT_CONTRACT_ADDRESS=${BOUNTY_MANAGER_ADDRESS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped

  # Reputation Service
  reputation-service:
    build:
      context: ./backend
      dockerfile: ./reputation-service/Dockerfile
    container_name: verdyx-reputation-service
    env_file:
      - .env
    ports:
      - "8087:8080"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://${POSTGRES_USER:-verdyx_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-verdyx}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      # Reputation calculation parameters
      - REPUTATION_DECAY_RATE=0.95
      - REPUTATION_UPDATE_INTERVAL=3600
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: ./backend
      dockerfile: ./notification-service/Dockerfile
    container_name: verdyx-notification-service
    env_file:
      - .env
    ports:
      - "8088:8080"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://${POSTGRES_USER:-verdyx_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-verdyx}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      # Email Configuration
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      # Webhook Configuration
      - WEBHOOK_TIMEOUT=30
      - MAX_RETRY_ATTEMPTS=3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped

  # Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: verdyx-frontend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-verdyx_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-verdyx}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET}
      API_URL: ${API_URL:-http://localhost:8080}
      BCRYPT_SALT_ROUNDS: 12
      SESSION_EXPIRY: 604800000
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/', (r) => {process.exit(r.statusCode < 500 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PgAdmin (Optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: verdyx-pgadmin
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@verdyx.io}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-CHANGE_ME}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - verdyx-network
    restart: unless-stopped

networks:
  verdyx-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
