global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # All backend services expose Prometheus text at :8080/metrics on the
  # internal compose network (verdyx-network). The `instance` label is set to
  # the service name so dashboards/alerts read cleanly.
  - job_name: verdyx-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8080"]
        labels: { service: api-gateway }
      - targets: ["user-service:8080"]
        labels: { service: user-service }
      - targets: ["analysis-engine:8080"]
        labels: { service: analysis-engine }
      - targets: ["bounty-manager:8080"]
        labels: { service: bounty-manager }
      - targets: ["submission-service:8080"]
        labels: { service: submission-service }
      - targets: ["consensus-service:8080"]
        labels: { service: consensus-service }
      - targets: ["payment-service:8080"]
        labels: { service: payment-service }
      - targets: ["reputation-service:8080"]
        labels: { service: reputation-service }
      - targets: ["notification-service:8080"]
        labels: { service: notification-service }
