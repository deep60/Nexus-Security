environment: production

server:
  host: 0.0.0.0
  port: 8080
  frontend_url: https://app.verdyx.com

database:
  url: ${DATABASE_URL}
  max_connections: 100
  min_connections: 10

redis:
  url: ${REDIS_URL}
  key_prefix: "verdyx:prod:"

blockchain:
  rpc_url: ${BLOCKCHAIN_RPC_URL}
  chain_id: ${CHAIN_ID}
  contracts:
    bounty_manager: "${BOUNTY_MANAGER_ADDRESS}"
    threat_token: "${THREAT_TOKEN_ADDRESS}"
    reputation_system: "${REPUTATION_SYSTEM_ADDRESS}"

services:
  api_gateway: https://api.verdyx.com
  analysis_engine: ${ANALYSIS_ENGINE_URL}
  bounty_manager: ${BOUNTY_MANAGER_URL}
  notification_service: ${NOTIFICATION_SERVICE_URL}
  storage_service: ${STORAGE_SERVICE_URL}

security:
  jwt_secret: ${JWT_SECRET}
  cors_allowed_origins:
    - https://app.verdyx.com

features:
  enable_blockchain: true
  enable_email: true
  enable_clamav: true
  enable_ipfs: false

logging:
  level: info
  format: json
  sentry_dsn: ${SENTRY_DSN}
