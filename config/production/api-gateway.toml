[server]
host = "0.0.0.0"
port = 8080
workers = 16
max_connections = 5000
keep_alive = 75
request_timeout_seconds = 30
graceful_shutdown_timeout_seconds = 30
environment = "production"

[database]
url = "${DATABASE_URL}"
max_connections = 100
min_connections = 20
connection_timeout_seconds = 30
idle_timeout_seconds = 600
max_lifetime_seconds = 1800
enable_logging = false
run_migrations = false

[redis]
url = "${REDIS_URL}"
max_connections = 150
connection_timeout_seconds = 5
pool_timeout_seconds = 10
enable_cluster = true
key_prefix = "verdyx:prod:"
default_ttl_seconds = 3600

[blockchain]
rpc_url = "${BLOCKCHAIN_RPC_URL}"
chain_id = 1
private_key = "${BLOCKCHAIN_PRIVATE_KEY}"
gas_limit = 500000
gas_price_gwei = 25
gas_price_multiplier = 1.2
max_gas_price_gwei = 500
confirmation_blocks = 6
transaction_timeout_seconds = 300
retry_attempts = 5
retry_delay_ms = 1500

[blockchain.contracts]
bounty_manager = "${BOUNTY_MANAGER_ADDRESS}"
threat_token = "${THREAT_TOKEN_ADDRESS}"
reputation_system = "${REPUTATION_SYSTEM_ADDRESS}"
governance = "${GOVERNANCE_ADDRESS}"

[security]
jwt_secret = "${JWT_SECRET}"
jwt_expiry_hours = 12
refresh_token_expiry_days = 14
api_key_length = 40
password_min_length = 12
password_require_special_char = true
password_require_number = true
password_require_uppercase = true
max_login_attempts = 5
lockout_duration_minutes = 30
session_timeout_minutes = 30

[security.cors]
allowed_origins = ["https://app.verdyx.com"]
allowed_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
allowed_headers = ["Authorization", "Content-Type", "X-API-Key"]
expose_headers = ["X-Request-Id"]
allow_credentials = true
max_age_seconds = 3600

[security.rate_limiting]
enabled = true
requests_per_minute = 120
burst_size = 200
auth_requests_per_15min = 10
api_requests_per_hour = 5000
whitelist_ips = []

[services]
analysis_engine_url = "${ANALYSIS_ENGINE_URL}"
bounty_manager_url = "${BOUNTY_MANAGER_URL}"
notification_service_url = "${NOTIFICATION_SERVICE_URL}"
storage_service_url = "${STORAGE_SERVICE_URL}"
ml_service_url = "${ML_SERVICE_URL}"
max_file_size_mb = 100
supported_file_types = ["exe", "dll", "pdf", "apk", "zip"]
analysis_timeout_seconds = 300
upload_path = "/var/lib/verdyx/uploads"

[features]
enable_file_uploads = true
enable_url_analysis = true
enable_blockchain_integration = true
enable_webhooks = true
enable_api_keys = true
enable_mfa = true
enable_oauth2 = true
enable_analytics = true
enable_ml_insights = true
enable_reputation_system = true
enable_gamification = true

[monitoring]
enable_metrics = true
enable_tracing = true
metrics_port = 9090
log_level = "info"
log_format = "json"
sentry_dsn = "${SENTRY_DSN}"
prometheus_enabled = true
jaeger_endpoint = "${JAEGER_ENDPOINT}"
